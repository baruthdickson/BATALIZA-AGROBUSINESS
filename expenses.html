<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://esm.sh">
  <link rel="preconnect" href="https://whexrklnrkigfqpdfzbt.supabase.co">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matumizi - BATALIZA AGROBUSINESS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <main class="lg:ml-64 min-h-screen">
    <div id="topbar-container"></div>
    <div class="p-4 lg:p-6 space-y-4">
      
      <!-- Stats -->
      <div id="expense-stats"></div>
      
      <!-- Filters & Actions -->
      <div class="card">
        <div class="flex flex-wrap items-end gap-3">
          <div class="flex-1 min-w-[180px]">
            <label class="form-label">🔍 Tafuta</label>
            <input type="search" id="filter-search" class="form-input" placeholder="Maelezo, supplier...">
          </div>
          <div>
            <label class="form-label">Shamba</label>
            <select id="filter-plot" class="form-select"></select>
          </div>
          <div>
            <label class="form-label">Tangu</label>
            <input type="date" id="filter-from" class="form-input">
          </div>
          <div>
            <label class="form-label">Mpaka</label>
            <input type="date" id="filter-to" class="form-input">
          </div>
          <button id="clear-filters" class="btn btn-secondary">✕ Futa</button>
          <button id="export-btn" class="btn btn-secondary">📥 Export</button>
          <button id="add-expense-btn" class="btn btn-primary">+ Matumizi Mapya</button>
        </div>
      </div>
      
      <!-- Table -->
      <div class="card p-0 overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Tarehe</th>
              <th>Shamba</th>
              <th>Maelezo / Kipengele</th>
              <th>Supplier</th>
              <th>Malipo</th>
              <th class="text-right">Kiasi (TZS)</th>
              <th>Risiti</th>
              <th>Hatua</th>
            </tr>
          </thead>
          <tbody id="expenses-tbody">
            <tr><td colspan="8" class="text-center text-gray-500 py-8">Inapakia...</td></tr>
          </tbody>
        </table>
        <div id="pagination" class="flex justify-between items-center p-4 text-sm text-gray-600 border-t border-green-100"></div>
      </div>
      
    </div>
  </main>
  
  <script type="module">
    import { requireBusinessUser, requirePermission } from './js/auth.js';
    import { initLayout } from './js/layout.js';
    import { initExpenses } from './js/pages/expenses.js';
    
    await requireBusinessUser();
    if (!requirePermission('expenses', 'view')) {}
    await initLayout('Matumizi');
    await initExpenses();
  </script>
</body>
</html>
