<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://esm.sh">
  <link rel="preconnect" href="https://whexrklnrkigfqpdfzbt.supabase.co">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bajeti - BATALIZA AGROBUSINESS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <main class="lg:ml-64 min-h-screen">
    <div id="topbar-container"></div>
    <div class="p-4 lg:p-6 space-y-4">
      
      <!-- Controls Card -->
      <div class="card">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <label class="form-label mb-0 whitespace-nowrap">📅 Bajeti:</label>
            <select id="period-select" class="form-select" style="width:auto;min-width:280px"></select>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="expand-all-btn" class="btn btn-secondary text-xs">▼ Fungua Zote</button>
            <button id="collapse-all-btn" class="btn btn-secondary text-xs">▲ Funga Zote</button>
            <button id="export-btn" class="btn btn-secondary">📥 Export</button>
            <button id="add-period-btn" class="btn btn-secondary pm-only" style="display:none">+ Bajeti Mpya</button>
            <button id="add-category-btn" class="btn btn-primary pm-only" style="display:none">+ Shughuli</button>
          </div>
        </div>
      </div>
      
      <!-- Read-only banner kwa muhasibu -->
      <div id="readonly-banner" class="card hidden" style="background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%); border-color: #60A5FA;">
        <div class="flex items-center gap-3">
          <div class="text-2xl">👁️</div>
          <div>
            <div class="font-bold text-blue-900">Hali ya Kutazama Tu (Read-Only)</div>
            <div class="text-sm text-blue-800">Unaweza kutazama bajeti iliyopangwa lakini huwezi kuibadilisha. Tengeneza ombi la pesa kwenye <a href="expense-requests.html" class="underline font-bold">Maombi ya Pesa</a>.</div>
          </div>
        </div>
      </div>
      
      <!-- Summary stats -->
      <div id="budget-summary"></div>
      
      <!-- Tree view -->
      <div class="card p-0 overflow-x-auto">
        <div id="budget-tree"></div>
      </div>
      
    </div>
  </main>
  
  <script type="module">
    import { requireBusinessUser, isPM, isAccountant } from './js/auth.js';
    import { initLayout } from './js/layout.js';
    import { initBudget } from './js/pages/budget.js';
    
    await requireBusinessUser();
    await initLayout('Bajeti');
    
    // Show/hide elements based on role
    if (isPM()) {
      document.querySelectorAll('.pm-only').forEach(el => el.style.display = '');
    }
    if (isAccountant()) {
      document.getElementById('readonly-banner').classList.remove('hidden');
    }
    
    await initBudget();
  </script>
</body>
</html>
