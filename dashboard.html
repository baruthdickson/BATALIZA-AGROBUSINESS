<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - BATALIZA AGROBUSINESS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <main class="lg:ml-64 min-h-screen">
    <div id="topbar-container"></div>
    <div class="p-4 lg:p-6 space-y-6">
      
      <!-- Stats -->
      <div id="overview-stats" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      
      <!-- Quick Actions -->
      <div class="card">
        <h3 class="text-lg font-bold text-green-900 mb-3">🚀 Vitendo vya Haraka</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <a href="expenses.html" class="btn btn-primary justify-center py-3">+ Matumizi Mapya</a>
          <a href="budget.html" class="btn btn-secondary justify-center py-3">📊 Tazama Bajeti</a>
          <a href="expenses.html?filter=pending" class="btn btn-secondary justify-center py-3">⏳ Yanasubiri</a>
          <a href="reports.html" class="btn btn-secondary justify-center py-3">📈 Ripoti</a>
        </div>
      </div>
      
      <!-- Budget breakdown + Recent + Alerts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Budget breakdown -->
        <div class="card">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-green-900">📊 Bajeti vs Matumizi (kwa Shughuli)</h3>
            <a href="budget.html" class="text-sm text-green-600 hover:underline">Tazama Yote →</a>
          </div>
          <div id="budget-breakdown"></div>
        </div>
        
        <!-- Alerts -->
        <div class="card">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-green-900">⚠️ Onyo (80%+ matumizi)</h3>
          </div>
          <table class="data-table">
            <tbody id="alerts-tbody">
              <tr><td colspan="2" class="text-center text-gray-500 py-6">Inapakia...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      
      <!-- Recent expenses -->
      <div class="card">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-lg font-bold text-green-900">🧾 Matumizi ya Hivi Karibuni</h3>
          <a href="expenses.html" class="text-sm text-green-600 hover:underline">Yote →</a>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr><th>Tarehe</th><th>Shamba</th><th>Maelezo</th><th class="text-right">Kiasi (TZS)</th><th>Status</th></tr>
            </thead>
            <tbody id="recent-tbody">
              <tr><td colspan="5" class="text-center text-gray-500 py-6">Inapakia...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      
    </div>
  </main>
  
  <script type="module">
    import { requireBusinessUser } from './js/auth.js';
    import { initLayout } from './js/layout.js';
    import { initDashboard } from './js/pages/dashboard.js';
    
    await requireBusinessUser();
    initLayout('Dashboard');
    await initDashboard();
  </script>
</body>
</html>
